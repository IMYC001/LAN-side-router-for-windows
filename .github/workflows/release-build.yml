name: Build v0.5.14 release packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-v0.5.14
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Export the published source tag
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --branch v0.5.14 https://github.com/IMYC001/LAN-side-router-for-windows.git tagged-source
          if ($LASTEXITCODE -ne 0) { throw 'Source clone failed.' }
          $commit = git -C tagged-source rev-parse HEAD
          if ($commit -ne '832f2feea8e4656e5aac4a0147b9aaf160dbdc52') {
            throw 'The release tag no longer matches the reviewed source.'
          }
          git -C tagged-source archive --format=zip --output=../release-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source export failed.' }
          Expand-Archive -LiteralPath release-source.zip -DestinationPath release-source
          git -C tagged-source fetch --depth 1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Publication metadata fetch failed.' }
          git -C tagged-source archive --format=zip --output=../publication-docs.zip $env:GITHUB_SHA README.md README.en.md CHANGELOG.md docs
          if ($LASTEXITCODE -ne 0) { throw 'Publication metadata export failed.' }
          Expand-Archive -LiteralPath publication-docs.zip -DestinationPath publication-docs
          foreach ($file in @('README.md', 'README.en.md', 'CHANGELOG.md')) {
            Copy-Item -LiteralPath "publication-docs/$file" -Destination "release-source/$file" -Force
          }
          $docsRoot = Join-Path $PWD 'publication-docs/docs'
          Get-ChildItem -LiteralPath $docsRoot -File -Recurse | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($docsRoot, $_.FullName)
            $target = Join-Path (Join-Path $PWD 'release-source/docs') $relative
            New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $target -Force
          }

      - name: Download verified tools and dependencies
        working-directory: release-source
        run: |
          ./scripts/Get-Tools.ps1
          ./scripts/Get-Mihomo.ps1
          ./scripts/Get-InstallerTools.ps1

      - name: Test and build the desktop application
        working-directory: release-source
        run: |
          ./scripts/Build.ps1 -OutputName Accelerator-0.5.14 -SmokeTest
          Get-Content test-results/Accelerator-0.5.14-checks.json

      - name: Build the installer
        working-directory: release-source
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Build-Installer.ps1 -OutputName Accelerator-0.5.14 -SkipAppBuild
          $lines = foreach ($name in @(
            'Accelerator-0.5.14-Setup-win-x64.exe'
          )) {
            $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content test-results/installer-checks.json
          Get-Content dist/SHA256SUMS.txt

      - name: Upload packages to the existing draft
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view v0.5.14 --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') {
            throw 'Only an existing draft release may receive these packages.'
          }
          gh release upload v0.5.14 `
            dist/Accelerator-0.5.14-Setup-win-x64.exe `
            dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          $metadata = gh release view v0.5.14 --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Release asset inspection failed.' }
          $release = $metadata | ConvertFrom-Json
          $files = @(
            'Accelerator-0.5.14-Setup-win-x64.exe',
            'SHA256SUMS.txt'
          )
          if (-not $release.isDraft -or $release.assets.Count -ne $files.Count) {
            throw 'Unexpected release state or asset count.'
          }
          foreach ($file in $files) {
            $asset = @($release.assets | Where-Object name -eq $file)
            $local = Get-Item -LiteralPath "dist/$file"
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $local.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or
                $asset[0].size -ne $local.Length -or $asset[0].digest -ne $digest) {
              throw "Release asset verification failed: $file"
            }
          }
          $metadata
